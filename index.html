<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="theme-color" content="#EDF2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1620" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF2F5; --surface:#FFFFFF; --surface2:#E3EBF0; --ink:#16222D; --muted:#566878; --line:#CBD7DF;
  --accent:#B9740F; --accent-ink:#FFFFFF; --accent-bg:#FBEACB;
  --ok:#2B6A5C; --ok-bg:#DAEEE8; --danger:#B03A2A;
  --c-push:#3C7A98; --c-quads:#2B6A5C; --c-pull:#7462A6; --c-glutes:#BE5F48; --c-rest:#8A9AA7;
  --ridge-far:#C6D5DE; --ridge-near:#8FAEC0; --ridge-snow:#F7FAFC;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#16212D; --surface2:#1F2D3B; --ink:#E7EEF4; --muted:#93A6B6; --line:#2B3C4D;
    --accent:#F0B45C; --accent-ink:#1B1204; --accent-bg:#3A2A10;
    --ok:#7BCBB6; --ok-bg:#183A33; --danger:#F08C7B;
    --c-push:#78B6D4; --c-quads:#6FC2AE; --c-pull:#A99AD9; --c-glutes:#EE9A82; --c-rest:#8195A5;
    --ridge-far:#1D2C3B; --ridge-near:#33516A; --ridge-snow:#DCE8F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212D; --surface2:#1F2D3B; --ink:#E7EEF4; --muted:#93A6B6; --line:#2B3C4D;
  --accent:#F0B45C; --accent-ink:#1B1204; --accent-bg:#3A2A10;
  --ok:#7BCBB6; --ok-bg:#183A33; --danger:#F08C7B;
  --c-push:#78B6D4; --c-quads:#6FC2AE; --c-pull:#A99AD9; --c-glutes:#EE9A82; --c-rest:#8195A5;
  --ridge-far:#1D2C3B; --ridge-near:#33516A; --ridge-snow:#DCE8F0;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:18px 16px 96px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.tabs button{flex:1;max-width:150px;border:0;background:none;padding:8px 4px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 12px;margin-bottom:12px}
.top h1{font-size:26px;font-weight:800}
.top select.sel{flex:1 1 100%;width:100%}
.top .sub{color:var(--muted);font-size:14px}
select.sel,input.field,textarea.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
select.sel{width:auto;max-width:100%}
textarea.field{min-height:76px;resize:vertical}

.banner{background:var(--accent-bg);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.warn{background:var(--surface2);border-color:var(--line)}

/* week tabs + strip */
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:21px 2px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:84px;position:relative}
.day .lb{font-size:10px;color:var(--muted);line-height:1}
.day .wd{font-size:12px;font-weight:600;color:var(--muted)}
.day .dn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.day .pip{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--c-rest));opacity:.35}
.day[data-st="part"] .pip{opacity:.7;box-shadow:inset 0 0 0 2px var(--surface)}
.day[data-st="done"] .pip{opacity:1}
.day[aria-pressed="true"]{border:2px solid var(--ink);padding:20px 1px 6px}
.day .ticks{position:absolute;top:5px;left:4px;display:flex;gap:1px}
.day .tick{width:13px;height:13px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;font-weight:800;line-height:13px;text-align:center}
.day .tick.mob{background:var(--c-pull)}
.day.today::after{content:"";position:absolute;top:8px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.dayhead{border-left:6px solid var(--pc,var(--c-rest));padding-left:12px;margin-bottom:12px}
.dayhead h2{font-size:24px;font-weight:800}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--pc,var(--ok));border-radius:99px;transition:width .2s}
details.card{padding:0}
details.card>summary{list-style:none;padding:12px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:48px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-size:20px;color:var(--muted)}
details.card[open]>summary::after{content:"\2212"}
details.card .inner{padding:0 14px 12px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:none}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-top:12px}
.ex h3{font-size:18px;font-weight:700}
.ex .meta{font-size:13px;color:var(--muted)}
.pr{background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.last{font-size:13px;color:var(--muted);margin:6px 0 2px}
.last button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 2px;text-decoration:underline;font-size:13px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.setrow .sn{font-weight:700;color:var(--muted);text-align:center}
.setrow label{display:block;position:relative}
.setrow input[type="text"]{width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:16px 8px 4px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.setrow label span{position:absolute;left:9px;top:4px;font-size:11px;color:var(--muted);pointer-events:none}
.setrow input[type="checkbox"]{width:30px;height:30px;accent-color:var(--ok);justify-self:center}
.setrow.ok input[type="text"]{border-color:var(--ok);background:var(--ok-bg)}
.vlink{display:inline-block;margin-top:8px;padding:6px 12px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;min-height:34px;line-height:20px}
.vlink.find{border-color:var(--line);color:var(--muted);font-weight:600}
.vlink.sm{margin:0 0 0 8px;padding:4px 10px;font-size:13px;min-height:32px;flex:none}
.vin{width:100%;margin-top:4px;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:14px}
.exfoot{display:flex;gap:8px;margin-top:10px}
.cyc{margin-bottom:12px}
.cyc .seg{flex-wrap:wrap}
.cyc .seg .chip{flex:1 1 45%}
.seg{display:flex;gap:6px;margin-top:10px}
.seg .chip{flex:1;text-align:center}
.wmode{margin-bottom:12px}
.wmode .nav{width:44px;padding:6px 0}
button.vlink{background:none;cursor:pointer;font-family:inherit}
.subnote{font-size:13px;color:var(--muted);margin-top:6px}
.subnote button{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:4px 2px;font-size:13px}
.sublist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.sublist button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;min-height:44px}
.sublist button:first-child{border-top:0}
.radio{display:flex;align-items:center;gap:10px;min-height:40px}
.radio input{width:20px;height:20px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn.block{width:100%}

/* rest day */
.restopt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--surface)}
.restopt[data-on="1"]{border-color:var(--ok);background:var(--ok-bg)}
.mini{width:92px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-weight:600}

/* month grid */
.mgrid{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.mgrid th{font-size:12px;color:var(--muted);font-weight:600;padding:0 0 2px}
.mgrid td{padding:0}
.cell{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
.cell[data-st="done"]{background:var(--pc);border-color:var(--pc);color:var(--bg)}
.cell[data-st="part"]{border:2px solid var(--pc);color:var(--ink)}
.cell[data-st="restdone"]{background:var(--surface2);color:var(--ink)}
.wk{font-size:12px;color:var(--muted);font-weight:600;width:34px;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 24px/1.1 "Bricolage Grotesque",Figtree,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.plist{margin:0;padding:0;list-style:none}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.plist li:first-child{border-top:0}

/* progress */
.range{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 0 0}
.range svg{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.exlist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:8px}
.exlist button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;min-height:44px}
.exlist button:first-child{border-top:0}
.exlist button[aria-pressed="true"]{background:var(--accent-bg)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:10px}
.chart svg{display:block;width:100%;height:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:22px;margin-bottom:10px}
.edrow{display:grid;grid-template-columns:1fr 62px auto;gap:6px;margin-top:8px;align-items:center}
.edrow input{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:50;font-size:14px;max-width:90vw}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* Title Case for exercise names; small words (a, an, the, of ...) stay lowercase unless they start the name. */
var TC_SMALL={a:1,an:1,the:1,of:1,and:1,or:1,to:1,in:1,on:1,at:1,for:1,with:1,by:1,vs:1};
var TC_ACR={db:'DB',ez:'EZ',kb:'KB',rdl:'RDL'};
function tc(str){
  var first=true;
  return String(str==null?'':str).split(/(\s+)/).map(function(w){
    if(!w||/^\s+$/.test(w))return w;
    var out=w.split('-').map(function(part,pi){
      var m=part.match(/^([^A-Za-z0-9]*)([A-Za-z0-9].*)$/);if(!m)return part;
      var pre=m[1],core=m[2],low=core.toLowerCase();
      if(TC_ACR[low])return pre+TC_ACR[low];
      if(core===core.toUpperCase()&&/[A-Z]{2,}/.test(core))return part;
      if(pi===0&&!first&&TC_SMALL[low])return pre+low;
      return pre+core.charAt(0).toUpperCase()+core.slice(1).toLowerCase().replace(/(^|\s)([a-z])/g,function(x){return x;});
    }).join('-');
    first=false;return out;
  }).join('');
}

  docRef:function(id){return this.db.collection('users/'+this.uid+'/data').doc(id);},

function monthStats(m){
  var L=S.logs[m.id]||{},sess=0,planned=0,sets=0,vol=0,rest=0,byDay={push:0,quads:0,pull:0,glutes:0};
  for(var w=0;w<m.weeks;w++){
    for(var d=0;d<4;d++){
      var key=sessKey(w,d),dayDef=m.days[DAYS[d].k];if(dayDef)planned++;
      var s=L[key];if(!s)continue;
      var st=sessionStats(s);sets+=st.sets;vol+=st.vol;byDay[DAYS[d].k]+=st.sets;
      if(s.done)sess++;
    }
    for(var r=4;r<7;r++){var rs=L[sessKey(w,r)];if(rs&&restDone(rs))rest++;}
  }
  return {sess:sess,planned:planned,sets:sets,vol:vol,rest:rest,byDay:byDay};
}
function restDone(r){return !!(r&&((r.walk&&r.walk.on)||(r.yoga&&r.yoga.on)||(r.med&&r.med.on)));}
function dayStatus(m,week,d){
  var s=getSess(m.id,sessKey(week,d),false);
  if(!s)return 'none';
  if(d<4){if(s.done)return 'done';return sessionStats(s).sets>0?'part':'none';}
  return restDone(s)?'restdone':'none';
}

/* ---------- history (per exercise) ---------- */
function buildHistory(){
  var H={},names={};
  getMonths().forEach(function(m){
    var L=S.logs[m.id];if(!L)return;
    Object.keys(L).forEach(function(sk){
      var s=L[sk];if(!s||!s.ex)return;
      var date=s.date||m.start||'',mid=m.n;
      Object.keys(s.ex).forEach(function(k){
        var e=s.ex[k],sets=(e.sets||[]).filter(setIsDone);
        if(!sets.length)return;
        var base=e.n?normKey(e.n):k.replace(/#\d+$/,'');
        (H[base]=H[base]||[]).push({date:date,n:mid,mid:m.id,sk:sk,sets:sets});
        names[base]=e.n||names[base]||base;
      });
    });
  });
  Object.keys(H).forEach(function(k){H[k].sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||a.n-b.n||a.sk.localeCompare(b.sk);});});
  return {H:H,names:names};
}

function exCard(e,k,base,sess,hist,sessionKey){

/* ----- progress ----- */
function metricValue(m,metric){
  var st=monthStats(m);
  return metric==='sessions'?st.sess:(metric==='sets'?st.sets:st.vol);
}
function ridgeSVG(metric){
  var all=getMonths(),first=-1;
  all.forEach(function(m,i){var st=monthStats(m);if(first<0&&(st.sets>0||st.sess>0))first=i;});
  var startIdx=first<0?Math.max(0,all.length-12):Math.max(0,first-1);
  var ms=all.slice(startIdx),vals=ms.map(function(m){return metricValue(m,metric);}),mx=Math.max.apply(null,vals.concat([1]));
  var step=44,W=ms.length*step+40,H=210,base=170,cur=S.monthId;
  var far='',near='',snow='',labels='',hit='',flag='';
  var farPts=[[0,base]];
  for(var i=0;i<=ms.length;i++){
    var a=vals[Math.max(0,i-1)]||0,b=vals[Math.min(ms.length-1,i)]||0,hh=18+((a+b)/2/mx)*70;
    farPts.push([20+i*step-step/2+step/2-step/2,base-hh*0.8]);
    farPts.push([20+i*step,base-hh*0.55-Math.abs(Math.sin(i*1.7))*14]);
  }
  farPts.push([W,base]);
  far='<path d="M'+farPts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L')+' Z" fill="var(--ridge-far)"/>';
  var pts=[[0,base]];
  ms.forEach(function(m,i){
    var x=20+i*step+step/2,v=vals[i],h=8+Math.pow(v/mx,0.85)*118,shoulder=Math.min(h*0.28,24);
    pts.push([x-step/2,base-shoulder*0.6]);pts.push([x,base-h]);pts.push([x+step/2,base-shoulder*0.6]);
    if(v>0){var cap=Math.min(h*0.32,26);
      snow+='<path d="M'+x+','+(base-h)+' L'+(x-cap*0.55)+','+(base-h+cap)+' L'+(x-cap*0.1)+','+(base-h+cap*0.72)+' L'+(x+cap*0.2)+','+(base-h+cap)+' L'+(x+cap*0.55)+','+(base-h+cap*0.8)+' Z" fill="var(--ridge-snow)"/>';}
    if(m.id===cur)flag='<circle cx="'+x+'" cy="'+(base-h-9)+'" r="4.5" fill="var(--accent)"/>';
    labels+='<text x="'+x+'" y="'+(base+22)+'" text-anchor="middle" font-size="11" fill="'+(m.id===cur?'var(--ink)':'var(--muted)')+'" font-weight="'+(m.id===cur?700:500)+'">'+(Math.floor(m.n)===m.n?m.n:Math.floor(m.n)+(m.n%1>0.15?'b':'a'))+'</text>';
    hit+='<rect x="'+(x-step/2)+'" y="0" width="'+step+'" height="'+(base+30)+'" fill="transparent" data-act="gomonth" data-v="'+m.id+'" style="cursor:pointer"><title>'+esc(m.label)+': '+(metric==='volume'?fmtNum(v)+' lb':v+' '+metric)+'</title></rect>';
  });
  pts.push([W,base]);
  near='<path d="M'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L')+' Z" fill="var(--ridge-near)"/>';
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Training range: one peak per month, taller means more '+metric+'">'+far+near+snow+flag
    +'<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)"/>'+labels+hit+'</svg>';
}
function lineChart(pts,label,unit){
  if(!pts.length)return '';
  var W=640,H=240,L=46,R=14,T=14,B=30;
  var ys=pts.map(function(p){return p.y;}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mx===mn){mx=mx+1;mn=Math.max(0,mn-1);}
  var span=mx-mn;mn=Math.max(0,mn-span*0.15);mx=mx+span*0.15;
  var X=function(i){return pts.length===1?(L+(W-L-R)/2):L+(W-L-R)*i/(pts.length-1);};
  var Y=function(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn));};
  var g='',i;
  for(i=0;i<=3;i++){var v=mn+(mx-mn)*i/3,yy=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+Math.round(v*10)/10+'</text>';}
  var path='M'+pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);}).join(' L');
  var dots=pts.map(function(p,i){return '<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>'+esc(p.t)+'</title></circle>';}).join('');
  var xl='<text x="'+X(0)+'" y="'+(H-8)+'" font-size="12" fill="var(--muted)" text-anchor="'+(pts.length===1?'middle':'start')+'">'+esc(pts[0].l)+'</text>'+(pts.length>1?'<text x="'+X(pts.length-1)+'" y="'+(H-8)+'" font-size="12" fill="var(--muted)" text-anchor="end">'+esc(pts[pts.length-1].l)+'</text>':'');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+(pts.length>1?'<path d="'+path+'" fill="none" stroke="var(--c-push)" stroke-width="2.5" stroke-linejoin="round"/>':'')+dots+xl+'</svg>';
}

/* ---------- mutations ---------- */
function touchSession(create){
  var m=getMonth(S.monthId),key=sessKeyFor(S.week,S.dayIdx),s=getSess(m.id,key,create);
  return {m:m,key:key,s:s};
}
function subName(m,sess,dayKey,k){
  if(sess&&sess.sub&&Object.prototype.hasOwnProperty.call(sess.sub,k))return sess.sub[k]||null;
  var ms=S.meta.subs&&S.meta.subs[m.id]&&S.meta.subs[m.id][dayKey]&&S.meta.subs[m.id][dayKey][k];
  return (ms&&S.week>=ms.w)?ms.n:null;
}
function subOptions(M){
  var seen={},all=[],q=(M.q||'').toLowerCase().trim(),words=normKey(M.planned).split('-');
  getMonths().forEach(function(m){Object.keys(m.days).forEach(function(dk){(m.days[dk].ex||[]).forEach(function(e){
    var key=normKey(e.n);if(seen[key])return;seen[key]=1;all.push({n:e.n,key:key,same:dk===M.dayKey});});});});
  var out=all.filter(function(o){return o.key!==normKey(M.planned)&&(q?o.n.toLowerCase().indexOf(q)>=0:o.same);});
  out.forEach(function(o){var w=o.key.split('-'),sc=0;w.forEach(function(x){if(words.indexOf(x)>=0&&x.length>2)sc++;});o.score=sc;});
  out.sort(function(a,b){return b.score-a.score||a.n.localeCompare(b.n);});
  return out.slice(0,40);
}
function subModalHTML(M){
  var opts=subOptions(M);
  var h='<h2>Substitute exercise</h2><p class="muted small" style="margin:0 0 8px">Replacing <b>'+esc(M.planned)+'</b>. Your logged sets, history and video follow the new movement.</p>'
   +'<label class="radio"><input type="radio" name="subscope" data-f="sub-scope" value="this"'+(M.scope==='this'?' checked':'')+'><span>Just this workout</span></label>'
   +'<label class="radio"><input type="radio" name="subscope" data-f="sub-scope" value="month"'+(M.scope==='month'?' checked':'')+'><span>This workout and the rest of the month</span></label>'
   +'<input class="field" type="search" style="margin-top:8px" placeholder="Search all exercises" data-f="sub-q" value="'+esc(M.q||'')+'" aria-label="Search exercises">'
   +'<div class="sublist" role="list">'+(opts.length?opts.map(function(o){return '<button data-act="subpick" data-v="'+esc(o.n)+'"><span>'+esc(o.n)+'</span>'+(videoFor(o.n)?'<span class="muted small">video</span>':'')+'</button>';}).join(''):'<div class="muted" style="padding:12px">No matches. Use your own name below.</div>')+'</div>'
   +'<div class="muted small">'+(M.q?'Showing matches from every day.':'Similar movements from your plans. Search to look across all days.')+'</div>'
   +'<label class="small muted" for="subc" style="display:block;margin-top:12px">Or type your own</label><div class="row"><input class="field grow" id="subc" data-f="sub-c" placeholder="e.g. Dumbbell Goblet Squat" value="'+esc(M.custom||'')+'"><button class="btn primary" data-act="subuse">Use name</button></div>'
   +'<div style="margin-top:14px"><button class="btn" data-act="closemodal">Cancel</button></div>';
  return h;
}
function openSub(k){
  var m=getMonth(S.monthId),e=exDef(m,k);if(!e)return;
  S.modal={type:'sub',k:k,dayKey:DAYS[liIdx()].k,planned:e.planned||e.n,q:'',scope:'this',custom:''};render();
}
function applySub(name){
  var M=S.modal,m=getMonth(S.monthId),c=touchSession(true);name=tc(String(name||'').trim());if(!name)return;
  if(M.scope==='month'){
    S.meta.subs=S.meta.subs||{};var a=S.meta.subs[m.id]=S.meta.subs[m.id]||{},b=a[M.dayKey]=a[M.dayKey]||{};
    b[M.k]={n:name,w:S.week};if(c.s.sub)delete c.s.sub[M.k];persistMeta();
  }else{c.s.sub=c.s.sub||{};c.s.sub[M.k]=name;}
  if(c.s.ex&&c.s.ex[M.k])c.s.ex[M.k].n=name;
  persistLog(c.m.id);S.modal=null;render();toast('Substituted with '+name);
}
/* ---------- remove exercise ---------- */
function exKeyList(day){var used={},out=[];(day.ex||[]).forEach(function(e){var b=normKey(e.n),k=b;if(used[b]){used[b]++;k=b+'#'+used[b];}else used[b]=1;out.push(k);});return out;}
function isRemoved(m,sess,dayKey,k){
  if(sess&&sess.rm&&Object.prototype.hasOwnProperty.call(sess.rm,k))return !!sess.rm[k];
  var r=S.meta.rms&&S.meta.rms[m.id]&&S.meta.rms[m.id][dayKey]&&S.meta.rms[m.id][dayKey][k];
  return !!(r&&S.week>=r.w);
}
function plannedFor(m,sess,dayKey){
  var day=m.days[dayKey]||{},ks=exKeyList(day),n=0;
  (day.ex||[]).forEach(function(e,i){if(!isRemoved(m,sess,dayKey,ks[i]))n+=e.s;});
  return n;
}
function openRm(k){
  var m=getMonth(S.monthId),e=exDef(m,k);if(!e)return;
  S.modal={type:'rm',k:k,dayKey:DAYS[liIdx()].k,name:e.n,scope:'this'};render();
}
function applyRm(){
  var M=S.modal,m=getMonth(S.monthId),c=touchSession(true);
  if(M.scope==='month'){
    S.meta.rms=S.meta.rms||{};var a=S.meta.rms[m.id]=S.meta.rms[m.id]||{},b=a[M.dayKey]=a[M.dayKey]||{};
    b[M.k]={w:S.week};if(c.s.rm)delete c.s.rm[M.k];persistMeta();
  }else{c.s.rm=c.s.rm||{};c.s.rm[M.k]=true;}
  persistLog(c.m.id);S.modal=null;render();toast('Removed '+M.name);
}
function undoRm(k){
  var c=touchSession(true);c.s.rm=c.s.rm||{};c.s.rm[k]=false;
  persistLog(c.m.id);render();toast('Exercise restored');
}
function undoSub(k){
  var c=touchSession(true);c.s.sub=c.s.sub||{};c.s.sub[k]='';
  var e=exDef(c.m,k);if(e&&c.s.ex&&c.s.ex[k])c.s.ex[k].n=e.n;
  persistLog(c.m.id);render();toast('Back to the planned exercise');
}
function ensureEx(sess,k,name){
  sess.ex=sess.ex||{};
  if(!sess.ex[k])sess.ex[k]={n:name,sets:[]};
  return sess.ex[k];
}
function exDef(m,k){
  var day=m.days[DAYS[liIdx()].k],used={},out=null;
  (day.ex||[]).forEach(function(e){var b=normKey(e.n),kk=b;if(used[b]){used[b]++;kk=b+'#'+used[b];}else used[b]=1;if(kk===k)out=e;});
  if(out){var sn=subName(m,getSess(m.id,sessKeyFor(S.week,S.dayIdx),false),DAYS[liIdx()].k,k);if(sn){out=Object.assign({},out,{n:sn,planned:out.n});delete out.t;}}
  return out;
}
function stampDate(sess){if(!sess.date)sess.date=todayISO();}
function updateLive(row){
  var ctx=touchSession(false);if(!ctx.s)return;
  var planned=plannedFor(ctx.m,ctx.s,DAYS[liIdx()].k),st=sessionStats(ctx.s);
  var el=document.getElementById('setprog');if(el)el.textContent=st.sets+' of '+planned+' sets logged';
  var bar=document.getElementById('progbar');if(bar)bar.style.width=Math.min(100,planned?Math.round(st.sets/planned*100):0)+'%';
  if(row){var cb=row.querySelector('input[type=checkbox]'),ok=cb&&cb.checked;row.classList.toggle('ok',!!ok);}
}
function onInput(t){
  var f=t.getAttribute('data-f');
  if(f==='mnote'){var mn=mobSess(S.calWeek,S.mobDay,true);mn.note=t.value;persistLog('mobility');return;}
  if(f==='w'||f==='r'){
    var ctx=touchSession(true),k=t.getAttribute('data-ex'),i=+t.getAttribute('data-i'),e=exDef(ctx.m,k);if(!e)return;
    var rec=ensureEx(ctx.s,k,e.n);while(rec.sets.length<=i)rec.sets.push({});
    var s=rec.sets[i];s[f]=t.value.trim();stampDate(ctx.s);
    var row=t.closest('.setrow'),cb=row.querySelector('input[type=checkbox]');
    var want=num(s.r)>0;if(f==='r'){s.d=want;cb.checked=want;}else if(want&&!s.d){s.d=true;cb.checked=true;}
    updateLive(row);persistLog(ctx.m.id);
  }else if(f==='note'){
    var c=touchSession(true);c.s.note=t.value;persistLog(c.m.id);
  }else if(f==='date'){
    var c2=touchSession(true);c2.s.date=t.value||undefined;persistLog(c2.m.id);
  }else if(f==='rest'){
    var c3=touchSession(true),g=t.getAttribute('data-g'),p=t.getAttribute('data-p');
    if(t.type!=='checkbox'){c3.s[g]=c3.s[g]||{};c3.s[g][p]=t.value;stampDate(c3.s);persistLog(c3.m.id);}
  }else if(f==='exq'){
    S.exQuery=t.value;var pos=t.selectionStart;render();var el=document.querySelector('[data-f=exq]');if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e2){}}
  }else if(f==='ed-n'){S.modal.ex[+t.getAttribute('data-i')].n=t.value;}
  else if(f==='sub-q'){S.modal.q=t.value;var pos=t.selectionStart;render();var el2=document.querySelector('[data-f=sub-q]');if(el2){el2.focus();try{el2.setSelectionRange(pos,pos);}catch(e3){}}}
  else if(f==='sub-c'){S.modal.custom=t.value;}
  else if(f==='ed-v'){S.modal.ex[+t.getAttribute('data-i')].v=t.value;}
  else if(f==='ed-s'){S.modal.ex[+t.getAttribute('data-i')].s=Math.max(1,Math.min(12,parseInt(t.value,10)||1));}
  else if(f==='nm-d'){S.modal.start=t.value;}
  else if(f==='nm-w'){S.modal.weeks=Math.max(1,Math.min(6,parseInt(t.value,10)||4));}
}
function onChange(t){
  var f=t.getAttribute('data-f');
  if(f==='mchk'){var mc=mobSess(S.calWeek,S.mobDay,true);mc.chk=mc.chk||{};mc.chk[t.getAttribute('data-name')]=t.checked;if(!mc.date)mc.date=todayISO();persistLog('mobility');render();return;}
  if(f==='mnote')return;
  if(f==='pickmob'){
    var pv=parseInt(t.value,10);
    if(MOB[pv]){var mp2=JSON.parse(JSON.stringify(S.meta.mobPick||{}));mp2[S.calWeek+'-d'+S.mobDay]=pv;S.meta.mobPick=mp2;persistMeta();render();toast(MOB[pv].t+' set for '+WD[S.mobDay]);}
    return;
  }
  if(f==='pickwo'){
    var want=parseInt(t.value,10);
    if(want>=0&&want<DAYS.length){
      var mp=currentMap(),fr=S.dayIdx,at=mp.indexOf(want);
      if(at!==fr){var swapped=mp[fr];mp[fr]=want;if(at>=0)mp[at]=swapped;S.meta.dayMap=S.meta.dayMap||{};S.meta.dayMap[S.calWeek]=mp;persistMeta();toast(DAYS[want].name+' set for '+WD[fr]);}
      else render();
    }else render();
    return;
  }
  if(f==='cycday'){var cv=parseInt(t.value,10);if(cv>0){var pd3=addDays(S.calWeek,isMob(S.calWeek)?S.mobDay:S.dayIdx);S.meta.cycle=S.meta.cycle||{};S.meta.cycle[pd3]=cv;persistMeta();render();}return;}
  if(f==='cadj'){var ck=t.getAttribute('data-ph'),cp=t.getAttribute('data-p');S.meta.cycleAdj=S.meta.cycleAdj||{};S.meta.cycleAdj[ck]=S.meta.cycleAdj[ck]||{};S.meta.cycleAdj[ck][cp]=parseInt(t.value,10)||0;persistMeta();return;}
  if(f==='jumpdate'){if(t.value){S.calWeek=weekMonday(t.value);S.dayIdx=S.mobDay=wdIndex(t.value);render();}return;}
  if(f==='planstart'){if(t.value){S.meta.planStart=weekMonday(t.value);applyPlanStart();persistMeta();render();toast('Plan now starts the week of '+fmtD(S.meta.planStart));}return;}
  if(f==='d'){
    var ctx=touchSession(true),k=t.getAttribute('data-ex'),i=+t.getAttribute('data-i'),e=exDef(ctx.m,k);if(!e)return;
    var rec=ensureEx(ctx.s,k,e.n);while(rec.sets.length<=i)rec.sets.push({});
    rec.sets[i].d=t.checked;stampDate(ctx.s);persistLog(ctx.m.id);render();
  }else if(f==='chk'){
    var c=touchSession(true),list=t.getAttribute('data-list'),nm=t.getAttribute('data-name');
    c.s[list]=c.s[list]||{};c.s[list][nm]=t.checked;stampDate(c.s);persistLog(c.m.id);render();
  }else if(f==='rest'){
    var c3=touchSession(true),g=t.getAttribute('data-g'),p=t.getAttribute('data-p');
    c3.s[g]=c3.s[g]||{};c3.s[g][p]=(t.type==='checkbox')?t.checked:t.value;stampDate(c3.s);persistLog(c3.m.id);
    if(t.type==='checkbox'||t.tagName==='SELECT')render();
  }else if(f==='nm-t'){S.modal.tpl=t.value;}
  else if(f==='sub-scope'){S.modal.scope=t.value;}
  else if(f==='import'){importFile(t.files&&t.files[0]);}
  else if(f==='date'||f==='note'){onInput(t);}
}

function act(el){
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  switch(a){
    case 'tab':S.tab=v;render();window.scrollTo(0,0);break;
    case 'week':S.week=+v;saveSel();render();break;
    case 'calweek':{S.calWeek=(v==='today')?weekMonday(todayISO()):addDays(S.calWeek,7*(+v));S.dayIdx=S.mobDay=(S.calWeek===weekMonday(todayISO())?wdIndex(todayISO()):0);render();break;}
    case 'setmob':{S.meta.mob=S.meta.mob||{};S.meta.mob[S.calWeek]=(v==='1');persistMeta();render();break;}
    case 'mobday':S.mobDay=+v;render();break;
    case 'moveday':S.modal={type:'moveday'};render();break;
    case 'moveto':{var to=+v,mp=currentMap(),fr=S.dayIdx,tmp=mp[fr];mp[fr]=mp[to];mp[to]=tmp;S.meta.dayMap=S.meta.dayMap||{};S.meta.dayMap[S.calWeek]=mp;persistMeta();S.dayIdx=to;S.modal=null;render();toast('Moved to '+WD[to]);break;}
    case 'resetmap':{if(S.meta.dayMap)delete S.meta.dayMap[S.calWeek];persistMeta();S.modal=null;render();toast('Back to the usual order');break;}
    case 'setphase':{var pd=addDays(S.calWeek,isMob(S.calWeek)?S.mobDay:S.dayIdx);S.meta.cycle=S.meta.cycle||{};S.meta.cycle[pd]=PH_START[v];persistMeta();render();break;}
    case 'cycday1':{var pd1=addDays(S.calWeek,isMob(S.calWeek)?S.mobDay:S.dayIdx);S.meta.cycle=S.meta.cycle||{};S.meta.cycle[pd1]=1;persistMeta();render();break;}
    case 'cycplus':{var pd2=addDays(S.calWeek,isMob(S.calWeek)?S.mobDay:S.dayIdx),p2=phaseFor(pd2);if(p2){S.meta.cycle=S.meta.cycle||{};S.meta.cycle[pd2]=p2.day+1;persistMeta();render();}break;}
    case 'clearphase':{var cd=addDays(S.calWeek,isMob(S.calWeek)?S.mobDay:S.dayIdx);if(S.meta.cycle)delete S.meta.cycle[cd];persistMeta();render();break;}
    case 'cycleon':S.meta.cycleOn=(v==='1');persistMeta();render();break;
    case 'clearcycle':S.modal={type:'confirm',title:'Clear cycle entries?',text:'This removes every cycle phase you have recorded. It can\u2019t be undone.',yes:'Clear entries',run:function(){S.meta.cycle={};persistMeta();S.modal=null;render();toast('Cycle entries cleared');}};render();break;
    case 'mobfinish':{var ms=mobSess(S.calWeek,S.mobDay,true);ms.done=!ms.done;if(!ms.date)ms.date=todayISO();persistLog('mobility');render();if(ms.done)toast('Day saved');break;}
    case 'day':S.dayIdx=+v;render();break;
    case 'selmonth':break;
    case 'open':S.monthId=S.monthId;S.week=+el.getAttribute('data-w');S.dayIdx=weekdayOf(+el.getAttribute('data-d'));S.tab='today';saveSel();render();window.scrollTo(0,0);break;
    case 'gomonth':S.monthId=v;S.week=0;S.tab='month';saveSel();render();window.scrollTo(0,0);break;
    case 'metric':S.metric=v;render();break;
    case 'pmetric':S.pmetric=v;render();break;
    case 'pickex':S.exKey=v;render();break;
    case 'theme':setTheme(v);break;
    case 'signout':if(window.AppBackend){AppBackend.signOut().then(function(){location.reload();});}break;
    case 'addset':{var c=touchSession(true),e=exDef(c.m,el.getAttribute('data-ex'));if(!e)break;var rec=ensureEx(c.s,el.getAttribute('data-ex'),e.n);var n=Math.max(e.s,rec.sets.length);while(rec.sets.length<n+1)rec.sets.push({});persistLog(c.m.id);render();break;}
    case 'rmset':{var c1=touchSession(true),k1=el.getAttribute('data-ex'),e1=exDef(c1.m,k1);if(!e1)break;var r1=ensureEx(c1.s,k1,e1.n);var n1=Math.max(e1.s,r1.sets.length);if(n1>1){r1.sets=r1.sets.slice(0,n1-1);while(r1.sets.length<n1-1)r1.sets.push({});}persistLog(c1.m.id);render();break;}
    case 'uselast':{
      var c2=touchSession(true),k2=el.getAttribute('data-ex'),b2=el.getAttribute('data-base'),e2=exDef(c2.m,k2),hist=buildHistory(),past=(hist.H[b2]||[]).filter(function(x){return !(x.mid===c2.m.id&&x.sk===c2.key);});
      var cur=c2.s.date||todayISO(),before=past.filter(function(x){return !x.date||x.date<=cur;}),last=before.length?before[before.length-1]:past[past.length-1];
      if(!last||!e2)break;var rec2=ensureEx(c2.s,k2,e2.n),n2=Math.max(e2.s,last.sets.length);
      rec2.sets=[];for(var i=0;i<n2;i++){var src=last.sets[Math.min(i,last.sets.length-1)];if(el.getAttribute('data-adj')==='1'){var phx=phaseFor(addDays(S.calWeek,S.dayIdx)),lpx=last.date?phaseFor(last.date):null;if(phx)src=adjSet(src,phx.k,lpx?lpx.k:null,(e2.u||'reps'));}var cur2=rec2.sets[i]={w:src.w||'',r:src.r||'',d:false};}
      stampDate(c2.s);persistLog(c2.m.id);render();toast('Filled in from last time. Tick each set as you finish it.');break;}
    case 'finish':{var c4=touchSession(true);c4.s.done=!c4.s.done;if(c4.s.done)stampDate(c4.s);persistLog(c4.m.id);render();if(c4.s.done)toast('Workout saved');break;}
    case 'edit':openEdit(v);break;
    case 'newmonth':openNewMonth();break;
    case 'closemodal':S.modal=null;render();break;
    case 'sub':openSub(el.getAttribute('data-ex'));break;
    case 'unsub':undoSub(el.getAttribute('data-ex'));break;
    case 'rm':openRm(el.getAttribute('data-ex'));break;
    case 'rm-do':applyRm();break;
    case 'unrm':undoRm(el.getAttribute('data-ex'));break;
    case 'subpick':applySub(v);break;
    case 'subuse':applySub(S.modal.custom);break;
    case 'closemodal-bg':if(el===lastTarget)S.modal=null,render();break;
    case 'ed-add':S.modal.ex.push({n:'New Exercise',s:3,u:'reps'});render();break;
    case 'ed-del':S.modal.ex.splice(+el.getAttribute('data-i'),1);render();break;
    case 'ed-up':{var i3=+el.getAttribute('data-i');if(i3>0){var t3=S.modal.ex[i3];S.modal.ex[i3]=S.modal.ex[i3-1];S.modal.ex[i3-1]=t3;}render();break;}
    case 'ed-down':{var i4=+el.getAttribute('data-i');if(i4<S.modal.ex.length-1){var t4=S.modal.ex[i4];S.modal.ex[i4]=S.modal.ex[i4+1];S.modal.ex[i4+1]=t4;}render();break;}
    case 'ed-save':saveEdit();break;
    case 'nm-create':createMonth();break;
    case 'exportjson':exportJSON();break;
    case 'exportcsv':exportCSV();break;
    case 'clearmonth':S.modal={type:'confirm',title:'Clear '+getMonth(S.monthId).label+'?',text:'This removes every logged set, note, and rest day in this month. It can\u2019t be undone.',yes:'Clear logs',run:function(){S.logs[S.monthId]={};persistLog(S.monthId);S.modal=null;render();toast('Month cleared');}};render();break;
    case 'confirm-yes':if(S.modal&&S.modal.run)S.modal.run();break;
  }
}
var lastTarget=null;
function saveSel(){S.meta.sel={monthId:S.monthId,week:S.week};persistMeta();}
function setTheme(v){
  S.theme=v;try{localStorage.setItem('ppw1:theme',v);}catch(e){}
  if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);
  render();
}

function openEdit(dayKey){
  var m=getMonth(S.monthId),day=m.days[dayKey]||{title:'',ex:[]},def=DAYS.filter(function(d){return d.k===dayKey;})[0];
  S.modal={type:'edit',dayKey:dayKey,title:'Edit '+def.name,ex:clone(day.ex||[]).map(function(e){e.v=videoFor(e.n)||'';return e;}),dayTitle:day.title||def.name};render();
}
function saveEdit(){
  var M=S.modal,m=getMonth(S.monthId);
  var ex=M.ex.filter(function(e){return String(e.n).trim();}).map(function(e){var o={n:tc(String(e.n).trim()),s:e.s||3,u:e.u||'reps'};if(e.t)o.t=e.t;if(e.r)o.r=e.r;return o;});
  S.meta.videos=S.meta.videos||{};
  M.ex.forEach(function(e){
    var n=String(e.n).trim();if(!n)return;
    var key=normKey(n),v=String(e.v||'').trim();
    if(v&&!/^https?:\/\//i.test(v))v='https://'+v;
    if(v===(VIDEOS[key]||''))delete S.meta.videos[key];else S.meta.videos[key]=v;
  });
  var entry={title:M.dayTitle,ex:ex};
  var custom=(S.meta.custom||[]).filter(function(c){return c.id===m.id;})[0];
  if(custom)custom.days[M.dayKey]=entry;else{S.meta.overrides=S.meta.overrides||{};S.meta.overrides[m.id]=S.meta.overrides[m.id]||{};S.meta.overrides[m.id][M.dayKey]=entry;}
  persistMeta();S.modal=null;render();toast('Plan updated');
}
function openNewMonth(){
  var l=latestDated(),start=l?nextMonday(addDays(l.start,l.weeks*7)):nextMonday(todayISO());
  var t=todayISO();if(start<t&&l&&diffDays(t,addDays(l.start,l.weeks*7-1))<=7)start=start;
  S.modal={type:'newmonth',tpl:(l||getMonths()[getMonths().length-1]).id,start:start,weeks:4};render();
}
function createMonth(){
  var M=S.modal,tpl=getMonth(M.tpl),ms=getMonths(),maxN=0;ms.forEach(function(m){maxN=Math.max(maxN,Math.floor(m.n));});
  if(!M.start){toast('Pick a start date');return;}
  var start=nextMonday(M.start);
  var nm=clone(tpl);nm.id='u'+Date.now().toString(36);nm.n=maxN+1;nm.label='Month '+(maxN+1);nm.start=start;nm.end=addDays(start,M.weeks*7-1);nm.weeks=M.weeks;
  S.meta.custom=(S.meta.custom||[]).concat([nm]);S.monthId=nm.id;S.week=0;S.tab='today';S.modal=null;
  S.meta.sel={monthId:nm.id,week:0};persistMeta();render();window.scrollTo(0,0);toast(nm.label+' created');
}

/* ---------- export / import ---------- */
function exportObj(){return {app:'workout-tracker',version:1,exportedAt:new Date().toISOString(),meta:S.meta,logs:S.logs};}
function saveFile(name,text,label){
  var p=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);
  p.then(function(dl){
    if(!dl){
      try{
        var blob=new Blob([text],{type:/\.csv$/.test(name)?'text/csv':'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
        a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},4000);toast('Saved '+name);return;
      }catch(e){}
      S.modal={type:'text',title:label,text:text};render();return;
    }
    return dl.save({filename:name,data:text}).then(function(){toast('Saved '+name);}).catch(function(e){if(e&&e.code!=='declined'){S.modal={type:'text',title:label,text:text};render();}});
  }).catch(function(){S.modal={type:'text',title:label,text:text};render();});
}
function exportJSON(){saveFile('workout-backup-'+todayISO()+'.json',JSON.stringify(exportObj(),null,1),'Backup (JSON)');}
function exportCSV(){
  var rows=[['date','month','week','day','exercise','set','weight_lb','reps_or_seconds','done','cycle_phase','cycle_day']];
  getMonths().forEach(function(m){
    var L=S.logs[m.id];if(!L)return;
    Object.keys(L).forEach(function(sk){
      var s=L[sk];if(!s||!s.ex)return;
      var mt=sk.match(/^w(\d+)-(.+)$/),dn=mt?mt[2]:sk;
      Object.keys(s.ex).forEach(function(k){(s.ex[k].sets||[]).forEach(function(x,i){
        if(!x.r&&!x.w)return;rows.push([s.date||'',m.label,mt?(+mt[1]+1):'',dn,s.ex[k].n||k,i+1,x.w||'',x.r||'',x.d?'yes':'no',(function(){var q=s.date&&phaseFor(s.date);return q?PH[q.k].n:'';})(),(function(){var q=s.date&&phaseFor(s.date);return q?q.day:'';})()]);});});
    });
  });
  var csv=rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
  saveFile('workout-sets-'+todayISO()+'.csv',csv,'Spreadsheet (CSV)');
}
function importFile(f){
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);if(!o||o.app!=='workout-tracker'||!o.logs)throw new Error('bad');
      S.modal={type:'confirm',title:'Restore this backup?',text:'This replaces the logs and custom months currently in the app with the ones in the file.',yes:'Restore',run:function(){
        var oldIds=Object.keys(S.logs);S.logs=o.logs;oldIds.forEach(function(id){if(!S.logs[id])Store.save('log-'+id,{});});S.meta=Object.assign({custom:[],overrides:{},videos:{},mob:{},cycle:{},dayMap:{},sel:null},o.meta||{});
        Object.keys(S.logs).forEach(persistLog);persistMeta();S.modal=null;pickInitialSelection();render();toast('Backup restored');}};
      render();
    }catch(e){toast('That file isn\u2019t a workout backup');}
  };
  rd.readAsText(f);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='SELECT')return;
  lastTarget=e.target;
  var a=el.getAttribute('data-act');
  if(a==='closemodal-bg'&&e.target!==el)return;
  act(el);
});
document.addEventListener('input',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-f'))onInput(t);});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('select[data-act="selmonth"]')){S.monthId=t.value;S.week=0;var h=monthForDate(todayISO());if(h&&h.m.id===t.value)S.week=h.week;saveSel();render();return;}
  if(t.getAttribute&&t.getAttribute('data-f'))onChange(t);
});
document.addEventListener('toggle',function(e){var t=e.target;if(t.tagName==='DETAILS'&&t.getAttribute('data-det')){S.open[t.getAttribute('data-det')]=t.open;}},true);

init();
})();
</script>
